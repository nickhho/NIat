name: GKI Android 12 - 5.10 Kernel Build

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Kernel release name"
        required: true
        default: "Zixine-GKI"
        type: string

      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "android12-5.10"
        type: string

      ksu_ref:
        description: "KernelSU branch/tag/commit"
        required: true
        default: "master"
        type: string

      build_jobs:
        description: "Parallel build jobs"
        required: true
        default: "2"
        type: string

      release:
        description: "Create GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  KERNEL_REPO: https://github.com/ramabondanp/android_kernel_common-5.10.git
  KERNEL_BRANCH: ${{ inputs.kernel_branch }}

  KSU_REPO: https://github.com/RapliVx/KernelSU.git
  KSU_REF: ${{ inputs.ksu_ref }}

  ANYKERNEL_REPO: https://github.com/zixine/anykernel.git

  ARCH: arm64
  SUBARCH: arm64

  OUT_DIR: ${{ github.workspace }}/out
  DIST_DIR: ${{ github.workspace }}/dist

jobs:
  build:
    name: Build GKI 5.10 arm64
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CLEAN RUNNER
      # ============================================================

      - name: Free runner disk space
        shell: bash
        run: |
          set -eux

          echo "=== DISK BEFORE ==="
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo apt-get clean

          echo "=== DISK AFTER ==="
          df -h


      # ============================================================
      # 2. CHECKOUT BUILD REPOSITORY
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 3. INSTALL BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cmake \
            cpio \
            flex \
            gcc \
            g++ \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            zstd

          echo "=== TOOLCHAIN ==="
          clang --version
          ld.lld --version
          llvm-ar --version
          lz4 --version


      # ============================================================
      # 4. CLONE KERNEL
      # ============================================================

      - name: Clone Android Common Kernel
        shell: bash
        run: |
          set -eux

          rm -rf kernel

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          cd kernel

          echo "Kernel commit:"
          git rev-parse HEAD

          echo "Kernel branch:"
          git branch --show-current

          echo "Kernel version:"
          make kernelversion


      # ============================================================
      # 5. VERIFY SOURCE
      # ============================================================

      - name: Verify GKI source
        shell: bash
        run: |
          set -eux

          cd kernel

          test -f Makefile
          test -f build.config.common
          test -f build.config.gki
          test -f build.config.gki.aarch64
          test -f arch/arm64/configs/gki_defconfig
          test -d drivers

          echo "GKI source verification OK"

          echo "=== BUILD CONFIG ==="
          cat build.config.common

          echo "=== GKI AARCH64 CONFIG ==="
          cat build.config.gki.aarch64


      # ============================================================
      # 6. INSTALL KERNELSU
      # ============================================================

      - name: Integrate RapliVx KernelSU
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "Installing RapliVx KernelSU..."
          echo "Ref: ${KSU_REF}"

          curl -LSs \
            "https://raw.githubusercontent.com/RapliVx/KernelSU/master/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh

          chmod +x /tmp/ksu-setup.sh

          /tmp/ksu-setup.sh "${KSU_REF}"

          echo "=== KernelSU integration ==="

          test -e drivers/kernelsu

          grep -q "kernelsu" drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

          echo "KernelSU integration OK"


      # ============================================================
      # 7. CONFIGURE KERNEL
      # ============================================================

      - name: Configure GKI
        shell: bash
        run: |
          set -eux

          cd kernel

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          echo "Generating GKI defconfig..."

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          echo "Enabling KernelSU..."

          "${GITHUB_WORKSPACE}/kernel/scripts/config" \
            --file "${OUT_DIR}/.config" \
            --enable CONFIG_KSU

          echo "Enabling GKI syscall hook requirements..."

          "${GITHUB_WORKSPACE}/kernel/scripts/config" \
            --file "${OUT_DIR}/.config" \
            --enable CONFIG_KPROBES

          "${GITHUB_WORKSPACE}/kernel/scripts/config" \
            --file "${OUT_DIR}/.config" \
            --enable CONFIG_KRETPROBES

          "${GITHUB_WORKSPACE}/kernel/scripts/config" \
            --file "${OUT_DIR}/.config" \
            --enable CONFIG_HAVE_SYSCALL_TRACEPOINTS

          echo "Regenerating configuration..."

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "=== IMPORTANT CONFIG ==="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_HAVE_SYSCALL_TRACEPOINTS|CONFIG_LTO_CLANG|CONFIG_CFI_CLANG)=' \
            "${OUT_DIR}/.config" || true

          echo "=== CONFIGURATION COMPLETE ==="


      # ============================================================
      # 8. BUILD KERNEL
      # ============================================================

      - name: Build kernel
        shell: bash
        env:
          KBUILD_BUILD_USER: "GitHub-Actions"
          KBUILD_BUILD_HOST: "github-runner"
        run: |
          set -eux

          cd kernel

          mkdir -p "${DIST_DIR}"

          echo "========================================"
          echo " STARTING GKI 5.10 ARM64 BUILD"
          echo "========================================"

          echo "Kernel:"
          make kernelversion

          echo "Compiler:"
          clang --version

          echo "CPU:"
          nproc

          echo "Requested jobs:"
          echo "${{ inputs.build_jobs }}"

          echo "Disk:"
          df -h

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"${{ inputs.build_jobs }}" \
            Image \
            Image.lz4 \
            modules

          echo "========================================"
          echo " BUILD FINISHED"
          echo "========================================"


      # ============================================================
      # 9. VERIFY BUILD OUTPUT
      # ============================================================

      - name: Verify kernel output
        shell: bash
        run: |
          set -eux

          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"
          IMAGE_LZ4="${OUT_DIR}/arch/arm64/boot/Image.lz4"

          test -f "${IMAGE}"
          test -f "${IMAGE_LZ4}"

          echo "Image:"
          ls -lh "${IMAGE}"

          echo "Image.lz4:"
          ls -lh "${IMAGE_LZ4}"

          echo "Kernel version:"
          strings "${IMAGE}" | grep -m1 "Linux version"

          echo "KernelSU:"
          grep '^CONFIG_KSU=' "${OUT_DIR}/.config"

          echo "=== MODULES ==="
          find "${OUT_DIR}" -type f -name "*.ko" | head -50 || true


      # ============================================================
      # 10. PREPARE ANYKERNEL3
      # ============================================================

      - name: Clone AnyKernel
        shell: bash
        run: |
          set -eux

          rm -rf anykernel

          git clone \
            --depth=1 \
            "${ANYKERNEL_REPO}" \
            anykernel

          cd anykernel

          echo "AnyKernel commit:"
          git rev-parse HEAD


      - name: Package AnyKernel ZIP
        shell: bash
        run: |
          set -eux

          cd anykernel

          # AnyKernel configuration in the supplied repository
          # expects an uncompressed Image.
          cp "${OUT_DIR}/arch/arm64/boot/Image" ./Image

          # Include kernel metadata for debugging/reproducibility.
          cp "${OUT_DIR}/.config" ./kernel.config

          if [ -f "${OUT_DIR}/System.map" ]; then
            cp "${OUT_DIR}/System.map" ./System.map
          fi

          # Remove repository git data if present.
          rm -rf .git

          DATE="$(date -u +%Y%m%d)"
          VERSION="$(cd "${GITHUB_WORKSPACE}/kernel" && make kernelversion)"
          ZIP_NAME="${{ inputs.kernel_name }}-GKI-5.10-${DATE}.zip"

          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"
          echo "KERNEL_VERSION=${VERSION}" >> "${GITHUB_ENV}"

          zip -r -9 \
            "${DIST_DIR}/${ZIP_NAME}" \
            . \
            -x "*.git*" \
            -x "README.md"

          test -f "${DIST_DIR}/${ZIP_NAME}"

          echo "========================================"
          echo " ANYKERNEL PACKAGE CREATED"
          echo "========================================"

          ls -lh "${DIST_DIR}/${ZIP_NAME}"


      # ============================================================
      # 11. COPY RAW KERNEL ARTIFACTS
      # ============================================================

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -eux

          cp \
            "${OUT_DIR}/arch/arm64/boot/Image" \
            "${DIST_DIR}/${{ inputs.kernel_name }}-Image"

          cp \
            "${OUT_DIR}/arch/arm64/boot/Image.lz4" \
            "${DIST_DIR}/${{ inputs.kernel_name }}-Image.lz4"

          cp \
            "${OUT_DIR}/.config" \
            "${DIST_DIR}/${{ inputs.kernel_name }}-defconfig"

          if [ -f "${OUT_DIR}/System.map" ]; then
            cp \
              "${OUT_DIR}/System.map" \
              "${DIST_DIR}/${{ inputs.kernel_name }}-System.map"
          fi

          echo "=== RELEASE FILES ==="
          ls -lah "${DIST_DIR}"


      # ============================================================
      # 12. CREATE BUILD INFO
      # ============================================================

      - name: Generate build information
        shell: bash
        run: |
          set -eux

          cd kernel

          {
            echo "Kernel Name: ${{ inputs.kernel_name }}"
            echo "Kernel Version: $(make kernelversion)"
            echo "Kernel Branch: ${KERNEL_BRANCH}"
            echo "Kernel Commit: $(git rev-parse HEAD)"
            echo "KernelSU Repository: ${KSU_REPO}"
            echo "KernelSU Ref: ${KSU_REF}"
            echo "AnyKernel Repository: ${ANYKERNEL_REPO}"
            echo "Architecture: ${ARCH}"
            echo "Compiler:"
            clang --version
            echo
            echo "CONFIG_KSU:"
            grep '^CONFIG_KSU=' "${OUT_DIR}/.config" || true
            echo "CONFIG_KPROBES:"
            grep '^CONFIG_KPROBES=' "${OUT_DIR}/.config" || true
            echo "CONFIG_KRETPROBES:"
            grep '^CONFIG_KRETPROBES=' "${OUT_DIR}/.config" || true
            echo
            echo "Build date UTC: $(date -u)"
          } > "${DIST_DIR}/BUILD_INFO.txt"

          cat "${DIST_DIR}/BUILD_INFO.txt"


      # ============================================================
      # 13. UPLOAD CI ARTIFACTS
      # ============================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-GKI-5.10
          path: dist/*
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 14. GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ inputs.kernel_name }}-GKI-5.10-${{ github.run_number }}"
          name: "${{ inputs.kernel_name }} GKI 5.10 Build #${{ github.run_number }}"
          body: |
            # ${{ inputs.kernel_name }} GKI Android 12 - 5.10

            ## Build Information

            - Kernel: Android Common Kernel 5.10
            - Architecture: ARM64
            - KernelSU: RapliVx/KernelSU
            - AnyKernel: zixine/anykernel
            - Source branch: `${{ inputs.kernel_branch }}`
            - KernelSU ref: `${{ inputs.ksu_ref }}`
            - GitHub Actions run: #${{ github.run_number }}

            ## Included

            - AnyKernel flashable ZIP
            - Raw `Image`
            - `Image.lz4`
            - Kernel defconfig
            - `System.map` when available
            - Build information

            ## Important

            This is a GKI kernel build. Device compatibility depends on the
            device's kernel/KMI, boot image layout, vendor implementation,
            security patch level, and required vendor modules.

          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
