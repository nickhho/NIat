name: GKI Android 12 - 5.10 Kernel Builder

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Kernel release name"
        required: true
        default: "Zixine-GKI"
        type: string

      kernel_branch:
        description: "Android Common Kernel branch"
        required: true
        default: "android12-5.10"
        type: string

      ksu_ref:
        description: "KernelSU branch, tag, or commit"
        required: true
        default: "master"
        type: string

      hz:
        description: "Kernel timer frequency (CONFIG_HZ)"
        required: true
        default: "500"
        type: choice
        options:
          - "250"
          - "300"
          - "500"
          - "1000"

      build_jobs:
        description: "Parallel build jobs"
        required: true
        default: "2"
        type: string

      create_release:
        description: "Create GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  KERNEL_REPO: "https://github.com/ramabondanp/android_kernel_common-5.10.git"
  KSU_REPO: "https://github.com/RapliVx/KernelSU.git"
  ANYKERNEL_REPO: "https://github.com/zixine/anykernel.git"

  ARCH: arm64
  SUBARCH: arm64

  KERNEL_DIR: "${{ github.workspace }}/kernel"
  OUT_DIR: "${{ github.workspace }}/out"
  DIST_DIR: "${{ github.workspace }}/dist"

jobs:
  build:
    name: Build GKI 5.10 ARM64
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. CLEAN RUNNER
      # ------------------------------------------------------------
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== DISK BEFORE ==="
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

          echo "=== DISK AFTER ==="
          df -h

      # ------------------------------------------------------------
      # 2. CHECKOUT WORKFLOW REPOSITORY
      # ------------------------------------------------------------
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 3. INSTALL BUILD DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cpio \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            zstd

          echo "=== TOOLCHAIN ==="
          clang --version
          ld.lld --version
          llvm-ar --version
          lz4 --version

      # ------------------------------------------------------------
      # 4. CLONE KERNEL SOURCE
      # ------------------------------------------------------------
      - name: Clone Android Common Kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${KERNEL_DIR}"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${{ inputs.kernel_branch }}" \
            "${KERNEL_REPO}" \
            "${KERNEL_DIR}"

          cd "${KERNEL_DIR}"

          echo "=== KERNEL SOURCE ==="
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Version: $(make kernelversion)"

          test -f Makefile
          test -f build.config.gki
          test -f build.config.gki.aarch64
          test -f arch/arm64/configs/gki_defconfig
          test -d drivers
          test -x scripts/config

      # ------------------------------------------------------------
      # 5. INSTALL RAPLI VX KERNELSU
      # ------------------------------------------------------------
      - name: Integrate RapliVx KernelSU
        shell: bash
        run: |
          set -euxo pipefail

          cd "${KERNEL_DIR}"

          echo "=== KERNELSU ==="
          echo "Repository: ${KSU_REPO}"
          echo "Ref: ${{ inputs.ksu_ref }}"

          curl -LSs \
            "https://raw.githubusercontent.com/RapliVx/KernelSU/master/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh

          chmod +x /tmp/ksu-setup.sh

          /tmp/ksu-setup.sh "${{ inputs.ksu_ref }}"

          test -e drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

          echo "KernelSU integration OK."

      # ------------------------------------------------------------
      # 6. GENERATE GKI DEFCONFIG + APPLY HZ
      # ------------------------------------------------------------
      - name: Configure GKI and KernelSU
        shell: bash
        run: |
          set -euxo pipefail

          cd "${KERNEL_DIR}"

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          CONFIG="${OUT_DIR}/.config"
          CONFIG_TOOL="${KERNEL_DIR}/scripts/config"

          echo "========================================"
          echo " GENERATING GKI DEFCONFIG"
          echo "========================================"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          test -f "${CONFIG}"

          echo "========================================"
          echo " APPLYING KERNELSU CONFIG"
          echo "========================================"

          "${CONFIG_TOOL}" --file "${CONFIG}" --enable CONFIG_KSU

          # KernelSU GKI syscall-hook requirements.
          "${CONFIG_TOOL}" --file "${CONFIG}" --enable CONFIG_KPROBES
          "${CONFIG_TOOL}" --file "${CONFIG}" --enable CONFIG_KRETPROBES
          "${CONFIG_TOOL}" --file "${CONFIG}" --enable CONFIG_HAVE_SYSCALL_TRACEPOINTS

          echo "========================================"
          echo " APPLYING CONFIG_HZ=${{ inputs.hz }}"
          echo "========================================"

          # Disable every HZ choice first. Ignore missing symbols because
          # kernel branches can differ in which HZ options they expose.
          for hz_symbol in \
            CONFIG_HZ_100 \
            CONFIG_HZ_250 \
            CONFIG_HZ_300 \
            CONFIG_HZ_500 \
            CONFIG_HZ_1000; do
            "${CONFIG_TOOL}" --file "${CONFIG}" --disable "${hz_symbol}" || true
          done

          case "${{ inputs.hz }}" in
            250|300|500|1000)
              "${CONFIG_TOOL}" \
                --file "${CONFIG}" \
                --enable "CONFIG_HZ_${{ inputs.hz }}"

              "${CONFIG_TOOL}" \
                --file "${CONFIG}" \
                --set-val CONFIG_HZ "${{ inputs.hz }}"
              ;;
            *)
              echo "ERROR: Unsupported CONFIG_HZ=${{ inputs.hz }}"
              exit 1
              ;;
          esac

          echo "========================================"
          echo " RESOLVING FINAL CONFIG"
          echo "========================================"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "========================================"
          echo " FINAL CONFIG CHECK"
          echo "========================================"

          grep -E \
            '^(CONFIG_HZ=|CONFIG_HZ_[0-9]+=|CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_KRETPROBES=|CONFIG_HAVE_SYSCALL_TRACEPOINTS=)' \
            "${CONFIG}" || true

          ACTUAL_HZ="$(sed -n 's/^CONFIG_HZ=//p' "${CONFIG}")"

          if [ "${ACTUAL_HZ}" != "${{ inputs.hz }}" ]; then
            echo "ERROR: Requested CONFIG_HZ=${{ inputs.hz }}, but final CONFIG_HZ=${ACTUAL_HZ}"
            exit 1
          fi

          if ! grep -q '^CONFIG_KSU=y$' "${CONFIG}"; then
            echo "ERROR: CONFIG_KSU is not enabled."
            exit 1
          fi

          echo "Configuration OK."

      # ------------------------------------------------------------
      # 7. BUILD KERNEL
      # ------------------------------------------------------------
      - name: Build GKI kernel
        shell: bash
        env:
          KBUILD_BUILD_USER: "GitHub-Actions"
          KBUILD_BUILD_HOST: "github-runner"
          KBUILD_BUILD_TIMESTAMP: "Fri Sep 04 00:00:00 UTC 2026"
        run: |
          set -euxo pipefail

          cd "${KERNEL_DIR}"

          mkdir -p "${DIST_DIR}"

          echo "========================================"
          echo " STARTING GKI 5.10 ARM64 BUILD"
          echo "========================================"

          echo "Kernel version: $(make kernelversion)"
          echo "CONFIG_HZ: ${{ inputs.hz }}"
          echo "Jobs: ${{ inputs.build_jobs }}"
          echo "Disk:"
          df -h

          # Thin LTO reduces memory requirements and is the recommended
          # build mode for constrained GitHub runners.
          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            LTO=thin \
            -j"${{ inputs.build_jobs }}" \
            Image \
            Image.lz4 \
            modules

          echo "========================================"
          echo " BUILD FINISHED"
          echo "========================================"

      # ------------------------------------------------------------
      # 8. VERIFY BUILD OUTPUT
      # ------------------------------------------------------------
      - name: Verify kernel output
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"
          IMAGE_LZ4="${OUT_DIR}/arch/arm64/boot/Image.lz4"
          CONFIG="${OUT_DIR}/.config"

          test -s "${IMAGE}"
          test -s "${IMAGE_LZ4}"
          test -s "${CONFIG}"

          echo "=== OUTPUT ==="
          ls -lh "${IMAGE}"
          ls -lh "${IMAGE_LZ4}"
          ls -lh "${CONFIG}"

          echo "=== KERNEL VERSION ==="
          strings "${IMAGE}" | grep -m1 'Linux version' || true

          echo "=== CONFIG_HZ ==="
          grep '^CONFIG_HZ=' "${CONFIG}"

          echo "=== KSU ==="
          grep '^CONFIG_KSU=' "${CONFIG}"

          echo "=== MODULE COUNT ==="
          find "${OUT_DIR}" -type f -name '*.ko' | wc -l

      # ------------------------------------------------------------
      # 9. CLONE ANYKERNEL
      # ------------------------------------------------------------
      - name: Clone AnyKernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${GITHUB_WORKSPACE}/anykernel"

          git clone \
            --depth=1 \
            "${ANYKERNEL_REPO}" \
            "${GITHUB_WORKSPACE}/anykernel"

          cd "${GITHUB_WORKSPACE}/anykernel"

          echo "AnyKernel commit: $(git rev-parse HEAD)"

          test -f anykernel.sh
          test -d tools

      # ------------------------------------------------------------
      # 10. PACKAGE ANYKERNEL ZIP
      # ------------------------------------------------------------
      - name: Package AnyKernel ZIP
        shell: bash
        run: |
          set -euxo pipefail

          AK_DIR="${GITHUB_WORKSPACE}/anykernel"
          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"

          VERSION="$(cd "${KERNEL_DIR}" && make kernelversion)"
          DATE="$(date -u +%Y%m%d)"
          ZIP_NAME="${{ inputs.kernel_name }}-GKI-5.10-HZ${{ inputs.hz }}-${DATE}.zip"

          echo "KERNEL_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

          rm -f "${AK_DIR}/Image"
          cp "${IMAGE}" "${AK_DIR}/Image"

          # Keep the exact final kernel config inside the package for
          # troubleshooting/reproducibility.
          cp "${OUT_DIR}/.config" "${AK_DIR}/kernel.config"

          cd "${AK_DIR}"

          rm -rf .git

          zip -r -9 \
            "${DIST_DIR}/${ZIP_NAME}" \
            . \
            -x '*.git*' \
            -x 'README.md'

          test -s "${DIST_DIR}/${ZIP_NAME}"

          echo "=== ANYKERNEL PACKAGE ==="
          ls -lh "${DIST_DIR}/${ZIP_NAME}"

      # ------------------------------------------------------------
      # 11. COPY RAW IMAGES
      # ------------------------------------------------------------
      - name: Prepare raw kernel artifacts
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            "${OUT_DIR}/arch/arm64/boot/Image" \
            "${DIST_DIR}/${{ inputs.kernel_name }}-Image"

          cp \
            "${OUT_DIR}/arch/arm64/boot/Image.lz4" \
            "${DIST_DIR}/${{ inputs.kernel_name }}-Image.lz4"

          cp \
            "${OUT_DIR}/.config" \
            "${DIST_DIR}/${{ inputs.kernel_name }}-defconfig"

          if [ -f "${OUT_DIR}/System.map" ]; then
            cp \
              "${OUT_DIR}/System.map" \
              "${DIST_DIR}/${{ inputs.kernel_name }}-System.map"
          fi

      # ------------------------------------------------------------
      # 12. BUILD INFO
      # ------------------------------------------------------------
      - name: Generate build information
        shell: bash
        run: |
          set -euxo pipefail

          cd "${KERNEL_DIR}"

          {
            echo "========================================"
            echo " GKI KERNEL BUILD INFORMATION"
            echo "========================================"
            echo "Kernel Name: ${{ inputs.kernel_name }}"
            echo "Kernel Version: $(make kernelversion)"
            echo "Kernel Branch: ${{ inputs.kernel_branch }}"
            echo "Kernel Commit: $(git rev-parse HEAD)"
            echo "Architecture: ${ARCH}"
            echo "CONFIG_HZ: ${{ inputs.hz }}"
            echo "KernelSU Repository: ${KSU_REPO}"
            echo "KernelSU Ref: ${{ inputs.ksu_ref }}"
            echo "AnyKernel Repository: ${ANYKERNEL_REPO}"
            echo "Build Run: #${{ github.run_number }}"
            echo "Build Date UTC: $(date -u)"
            echo
            echo "CONFIG_KSU:"
            grep '^CONFIG_KSU=' "${OUT_DIR}/.config" || true
            echo
            echo "CONFIG_HZ:"
            grep '^CONFIG_HZ=' "${OUT_DIR}/.config" || true
            echo
            echo "Kernel compiler:"
            clang --version
          } > "${DIST_DIR}/BUILD_INFO.txt"

          cat "${DIST_DIR}/BUILD_INFO.txt"

      # ------------------------------------------------------------
      # 13. UPLOAD CI ARTIFACT
      # ------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.kernel_name }}-GKI-5.10-HZ${{ inputs.hz }}-${{ github.run_number }}"
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      # ------------------------------------------------------------
      # 14. CREATE GITHUB RELEASE
      # ------------------------------------------------------------
      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ inputs.kernel_name }}-GKI-5.10-HZ${{ inputs.hz }}-${{ github.run_number }}"
          name: "${{ inputs.kernel_name }} GKI 5.10 HZ${{ inputs.hz }} #${{ github.run_number }}"
          body: |
            # ${{ inputs.kernel_name }} — Android 12 GKI 5.10

            ## Build

            - Architecture: ARM64
            - Source branch: `${{ inputs.kernel_branch }}`
            - Kernel commit: `${{ github.sha }}`
            - CONFIG_HZ: `${{ inputs.hz }}`
            - KernelSU ref: `${{ inputs.ksu_ref }}`
            - GitHub Actions run: #${{ github.run_number }}

            ## Assets

            - AnyKernel flashable ZIP
            - Raw `Image`
            - `Image.lz4`
            - Final kernel config
            - `System.map` when available
            - `BUILD_INFO.txt`

            ## Source

            Android Common Kernel:
            https://github.com/ramabondanp/android_kernel_common-5.10

            KernelSU:
            https://github.com/RapliVx/KernelSU

            AnyKernel:
            https://github.com/zixine/anykernel

            ## Compatibility

            This is a GKI 5.10 ARM64 build. Device compatibility is not
            guaranteed solely by the Android version. The device must match
            the kernel/KMI and boot/vendor requirements.

      # ------------------------------------------------------------
      # 15. FINAL SUMMARY
      # ------------------------------------------------------------
      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo " WORKFLOW SUMMARY"
          echo "========================================"
          echo "Kernel: ${{ inputs.kernel_name }}"
          echo "Branch: ${{ inputs.kernel_branch }}"
          echo "CONFIG_HZ: ${{ inputs.hz }}"
          echo "KernelSU ref: ${{ inputs.ksu_ref }}"
          echo "Run: #${{ github.run_number }}"
          echo
          echo "Artifacts:"
          ls -lah "${DIST_DIR}" 2>/dev/null || true
          echo
          echo "Disk:"
          df -h
